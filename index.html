<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1976d2" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="IP 网络工具" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>IP 查询与网络诊断</title>
  <meta name="description" content="IP 查询、网站分流、WebRTC 检测、全球 Ping、服务状态和 WHOIS 查询工具。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // Classic ES5 script: IE cannot execute the application's module bundle.
    (function () {
      var root = document.documentElement;
      // Fallback only: production must also send frame-ancestors / X-Frame-Options.
      if (window.self !== window.top) {
        root.className = "embedded-browser";
        return;
      }
      if (document.documentMode || /MSIE|Trident/.test(navigator.userAgent)) {
        root.className = "unsupported-browser";
        return;
      }
      try {
        // Three-state theme boot (ecosystem parity).
        var NEW_KEY = "one-ip-theme";
        var LEGACY_KEY = "theme";
        var stored = null;
        try { stored = localStorage.getItem(NEW_KEY); } catch (e) {}
        // Legacy key migration (one-time).
        if (!stored) {
          try {
            var legacy = localStorage.getItem(LEGACY_KEY);
            if (legacy === "light" || legacy === "dark" || legacy === "system") {
              stored = legacy;
              try { localStorage.setItem(NEW_KEY, legacy); } catch (e) {}
            }
          } catch (e) {}
        }
        var choice = (stored === "light" || stored === "dark" || stored === "system")
          ? stored
          : "system";
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var resolved = choice === "system" ? (mq.matches ? "dark" : "light") : choice;
        function apply() {
          resolved = choice === "system" ? (mq.matches ? "dark" : "light") : choice;
          root.setAttribute("data-theme", resolved);
          root.setAttribute("data-theme-choice", choice);
          root.classList.toggle("dark", resolved === "dark");
          root.style.colorScheme = resolved;
        }
        apply();
        if (typeof mq.addEventListener === "function") {
          mq.addEventListener("change", function () {
            if (choice === "system") apply();
          });
        }
        window.oneIpTheme = {
          get: function () { return choice; },
          set: function (next) {
            if (next !== "light" && next !== "dark" && next !== "system") next = "system";
            choice = next;
            try { localStorage.setItem(NEW_KEY, choice); } catch (e) {}
            apply();
            // Notify React so theme-aware components re-render.
            window.dispatchEvent(
              new StorageEvent("storage", {
                key: NEW_KEY,
                newValue: choice,
                storageArea: localStorage,
              }),
            );
          },
        };
        // Preserve legacy data-color / data-radius / data-layout / data-font-size attrs.
        ["color", "radius", "layout", "font-size"].forEach(function (key) {
          var value = localStorage.getItem("ui-" + key);
          if (value && value !== "default") root.setAttribute("data-" + key, value);
        });
      } catch (error) {
        // Keep the page usable when browser storage is unavailable.
      }
    })();
  </script>
  <style>
    html {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    .embedded-browser body {
      display: none !important;
    }

    #unsupported-browser {
      display: none;
    }

    .unsupported-browser #root {
      display: none;
    }

    .unsupported-browser #unsupported-browser {
      display: block;
      max-width: 640px;
      margin: 80px auto;
      padding: 24px;
      font-family: sans-serif;
      line-height: 1.8;
      color: #171717;
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="unsupported-browser" role="alert">
    <h1>不支持 Internet Explorer</h1>
    <p>请使用最新版 Microsoft Edge、Google Chrome、Firefox 或 Safari 访问本站。</p>
    <a href="https://www.microsoft.com/edge">下载 Microsoft Edge</a>
  </div>
  <noscript>请启用 JavaScript，并使用现代浏览器访问本站。</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
